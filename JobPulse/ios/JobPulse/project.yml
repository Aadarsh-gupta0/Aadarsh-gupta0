# Optional. `JobPulse.xcodeproj` is committed and works as-is — this file only
# exists so the project can be regenerated from scratch if it ever gets into a
# bad state, or if you prefer not to keep a .xcodeproj in git:
#
#   brew install xcodegen && cd ios/JobPulse && xcodegen generate

name: JobPulse
options:
  bundleIdPrefix: com.aadarsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  JobPulse:
    type: application
    platform: iOS
    sources:
      - path: JobPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aadarsh.jobpulse
        INFOPLIST_FILE: JobPulse/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: JobPulse/JobPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: JobPulseNotificationService
        embed: true

  JobPulseNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: JobPulseNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aadarsh.jobpulse.NotificationService
        INFOPLIST_FILE: JobPulseNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  JobPulse:
    build:
      targets:
        JobPulse: all
    run:
      config: Debug
    archive:
      config: Release
